- defaults:
    link:
      force: true

- link:
    ~/.config/nvim/init.lua: nvim/init.lua
    ~/.config/nvim/lua/custom/plugins/vim-tmux-navigator.lua: nvim/vim-tmux-navigator.lua
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    ~/.config/tmuxai/config.yaml: tmux/config.yaml
    ~/.gitconfig: git-cfg/gitconfig
    ~/.p10k.zsh: zsh/p10k.zsh
    ~/.zshrc: zsh/zshrc

- shell:
  - [git submodule update --init --recursive, Installing submodules]

